name: Python CI/CD with Creative Enhancements

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - uses: actions/checkout@v4

      # Set up Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Lint with flake8
      - name: Lint with flake8
        run: |
          echo "Running flake8 to check code quality..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Security check with bandit
      - name: Security check with bandit
        run: |
          echo "Running bandit to check for security issues..."
          bandit -r .

      # Run tests with pytest and generate coverage report
      - name: Test with pytest
        run: |
          echo "Running tests and generating coverage report..."
          pytest --cov=./ --cov-report=xml:coverage.xml --junitxml=test-results.xml

      # Upload test results as an artifact
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

      # Upload coverage report to Codecov (optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          fail_ci_if_error: false

      # Notify Slack on success or failure (optional)
      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Python CI/CD Status"
          SLACK_MESSAGE: "Workflow *${{ github.workflow }}* for *${{ github.repository }}* (Branch: ${{ github.ref }}) has *${{ job.status }}*."
